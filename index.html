<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <title>Canopy Energy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #dbeafe;
            --text-main: #0f172a;
            --text-muted: #475569; /* Plus foncé pour une meilleure lisibilité */
            --border: #cbd5e1;     /* Bordures plus nettes */
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; font-size: 1.1rem; }
        
        /* HEADER */
        header { background: var(--primary-dark); color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .brand-title { font-size: 1.4rem; font-weight: 700; }
        .sync-badge { font-size: 0.9rem; padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.25); font-weight: 700; }

        .container { padding: 16px; max-width: 800px; margin: 0 auto; }

        /* CARTES */
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px -2px rgba(0,0,0,0.08); }
        .card h2 { font-size: 1.3rem; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-weight: 700; }

        /* FORMULAIRES & TEXTES AGRANDIS */
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 1.05rem; color: var(--text-main); }
        
        /* Champs bien grands et lisibles (18px) */
        input, select { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 1.15rem; background: #f8fafc; color: var(--text-main); outline: none; appearance: none; font-weight: 600; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); background: #fff; }
        
        /* ACTIVITÉS */
        .activity-row { background: #f8fafc; border: 2px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .relative-wrapper { position: relative; }
        
        /* SUGGESTIONS AUTOCOMPLETE PLUS GRANDES */
        .autocomplete-suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 2px solid var(--primary); border-radius: 12px; margin-top: 6px; max-height: 280px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 25px -3px rgba(0,0,0,0.15); }
        .autocomplete-suggestion { padding: 16px; border-bottom: 1px solid #e2e8f0; font-size: 1.1rem; cursor: pointer; font-weight: 600; }
        .autocomplete-suggestion:active { background: var(--primary-light); }
        .suggestion-hint { font-size: 1rem; color: var(--primary); margin-top: 8px; font-weight: 700; text-align: right; }

        /* BOUTONS GAILLARDS */
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 1.15rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        button.primary { background: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(37,99,235,0.3); }
        button.success { background: var(--success); color: white; box-shadow: 0 4px 6px -1px rgba(5,150,105,0.3); }
        button.warning { background: var(--warning); color: #fff; font-weight: 700; }
        
        /* BANNIÈRES */
        .status-banner { padding: 18px; border-radius: 12px; background: var(--primary-light); border-left: 6px solid var(--primary); color: var(--primary-dark); font-size: 1.1rem; line-height: 1.6; margin-bottom: 16px; font-weight: 600; }

        /* TABLEAUX LISIBLES */
        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 2px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 16px 14px; text-align: left; font-size: 1.05rem; border-bottom: 2px solid var(--border); white-space: nowrap; }
        th { background: #f1f5f9; color: var(--text-main); font-weight: 700; }

        /* NAVIGATION BASSE GRANDE ET CLAIRE */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 5px 20px 5px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 100; border-top: 2px solid var(--border); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 0.85rem; font-weight: 700; border: none; background: none; padding: 6px 0; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.6rem; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        #capture-container { position: absolute; left: -9999px; top: 0; width: 900px; background: white; padding: 30px; }
    </style>
</head>
<body>

<header>
    <div class="brand-title">🌿 Canopy Energy</div>
    <div id="sync-status" class="sync-badge">☁️ Hors-ligne</div>
</header>

<div class="container">
    
    <div class="card" id="global-context-card">
        <div class="form-group" style="margin-bottom: 0;">
            <label>👤 Chef d'équipe</label>
            <select id="select-global-chef" onchange="onChefChange()"></select>
        </div>
    </div>

    <!-- ONGLET 1 -->
    <div id="tab1" class="tab-content active">
        <div class="card">
            <h2>🔍 Catalogue des Tâches</h2>
            <div class="form-group relative-wrapper">
                <input type="text" id="search-code" class="act-code" inputmode="search" oninput="suggestCode(this)" onfocus="suggestCode(this)" placeholder="Rechercher une tâche...">
                <div class="autocomplete-suggestions"></div>
            </div>
            <div id="consultation-result" style="margin-top:16px; font-weight:700; font-size:1.1rem; color:var(--primary); padding:16px; background:var(--primary-light); border-radius:12px; display:none;"></div>
        </div>
    </div>

    <!-- ONGLET 2 -->
    <div id="tab2" class="tab-content">
        <div class="card">
            <div class="form-group">
                <label>📅 Date du travail</label>
                <input type="date" id="input-saisie-date" onchange="onOuvrierOrDateChange()">
            </div>

            <div class="form-group">
                <label>👷‍♂️ Ouvrier</label>
                <select id="select-ouvrier" onchange="onOuvrierOrDateChange()"></select>
            </div>

            <div id="worker-status-banner" class="status-banner">Sélectionnez un ouvrier.</div>
        </div>

        <div class="card">
            <h2>✍️ Saisie des Activités (Max 3)</h2>
            <div id="activities-container">
                <!-- Ligne 1 -->
                <div class="activity-row">
                    <div class="form-group relative-wrapper">
                        <label>Tâche 1</label>
                        <input type="text" class="act-code" inputmode="search" data-valid="false" placeholder="Choisir la tâche..." oninput="suggestCode(this)" onfocus="suggestCode(this)">
                        <div class="autocomplete-suggestions"></div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Quantité réalisée</label>
                        <input type="number" class="act-real" inputmode="decimal" min="0" step="any" placeholder="0" oninput="recalculerLignes()">
                        <div class="suggestion-hint"></div>
                    </div>
                </div>
                
                <!-- Ligne 2 -->
                <div class="activity-row">
                    <div class="form-group relative-wrapper">
                        <label>Tâche 2</label>
                        <input type="text" class="act-code" inputmode="search" data-valid="false" placeholder="Choisir la tâche..." oninput="suggestCode(this)" onfocus="suggestCode(this)">
                        <div class="autocomplete-suggestions"></div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Quantité réalisée</label>
                        <input type="number" class="act-real" inputmode="decimal" min="0" step="any" placeholder="0" oninput="recalculerLignes()">
                        <div class="suggestion-hint"></div>
                    </div>
                </div>

                <!-- Ligne 3 -->
                <div class="activity-row">
                    <div class="form-group relative-wrapper">
                        <label>Tâche 3</label>
                        <input type="text" class="act-code" inputmode="search" data-valid="false" placeholder="Choisir la tâche..." oninput="suggestCode(this)" onfocus="suggestCode(this)">
                        <div class="autocomplete-suggestions"></div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Quantité réalisée</label>
                        <input type="number" class="act-real" inputmode="decimal" min="0" step="any" placeholder="0" oninput="recalculerLignes()">
                        <div class="suggestion-hint"></div>
                    </div>
                </div>
            </div>

            <button onclick="enregistrerSaisie()" class="success" style="margin-top:16px;">💾 Enregistrer l'ouvrier</button>
        </div>
    </div>

    <!-- ONGLET 3 -->
    <div id="tab3" class="tab-content">
        <div class="card">
            <h2>📊 Bilan Journalier</h2>
            <div class="form-group" style="margin-bottom:0;">
                <label>Date du rapport</label>
                <input type="date" id="report-date" onchange="rafraichirRapports()">
            </div>
        </div>

        <div class="card">
            <h2>Volumes Globaux</h2>
            <div class="table-wrapper">
                <table id="table-global-taches">
                    <thead><tr><th>Tâche</th><th>Vol. Cumul</th><th>Unités</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Détail par Ouvrier</h2>
            <div class="table-wrapper">
                <table id="table-detail-ouvriers">
                    <thead><tr><th>Ouvrier</th><th>Activités</th><th>Unités</th><th>Ar</th><th>Action</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <button onclick="capturerRapport()" class="warning" style="margin-top:20px;">📸 Exporter en Image</button>
        </div>
    </div>

    <!-- ONGLET 4 -->
    <div id="tab4" class="tab-content">
        <div class="card">
            <h2>🔄 Synchronisation</h2>
            <div class="status-banner" id="sync-summary-banner" style="background:#fff; border: 2px solid var(--warning); border-left: 6px solid var(--warning);">
                Lignes en attente : <strong>0</strong>
            </div>

            <button onclick="synchroniserDonnees()" class="primary" style="margin-bottom:16px;">📤 Envoyer vers Google Sheets</button>
            <button onclick="chargerReferentiels()" style="background:#e2e8f0; color:var(--text-main); font-weight:700;">📥 Mettre à jour les bases</button>
        </div>
    </div>
</div>

<!-- NAVIGATION BASSE -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab1', this)">
        <span class="nav-icon">🔍</span>
        <span>Recherche</span>
    </button>
    <button class="nav-item" id="btn-tab-saisie" onclick="switchTab('tab2', this)">
        <span class="nav-icon">✍️</span>
        <span>Saisie</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab3', this)">
        <span class="nav-icon">📊</span>
        <span>Bilan</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab4', this)">
        <span class="nav-icon">🔄</span>
        <span>Sync</span>
    </button>
</nav>

<div id="capture-container"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3to942EW3_6UaNO76a1b0LNDrTQaSRQCFhZYBewolTslE54KzIQQAwTvLVvnzZkIi-g/exec";
    const MAX_TACHES_JOUR = 2; 
    
    let appState = { taches: [], ouvriers: [], saisies: [], activeChef: "" };

    window.onload = async () => {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('input-saisie-date').value = todayStr;
        document.getElementById('report-date').value = todayStr;
        
        chargerStockageLocal();
        await chargerReferentiels();
        initialiserUI();
    };

    function chargerStockageLocal() {
        appState.taches = JSON.parse(localStorage.getItem('ref_taches') || '[]');
        appState.ouvriers = JSON.parse(localStorage.getItem('ref_ouvriers') || '[]');
        appState.saisies = JSON.parse(localStorage.getItem('saisies_hors_ligne') || '[]');
    }

    async function chargerReferentiels() {
        if (!navigator.onLine) {
            updateSyncBadge("☁️ Hors-ligne", "var(--warning)");
            return;
        }
        try {
            updateSyncBadge("🔄 MAJ...", "var(--warning)");
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();

            if (data.status === "success") {
                if (data.taches && data.taches.length > 0) {
                    appState.taches = data.taches.map(row => ({
                        code: String(row[0] || '').trim(),       
                        desc: String(row[1] || '').trim(),       
                        quota: parseFloat(row[2]) || 0,          
                        unite: String(row[3] || '').trim(),      
                        prix: parseFloat(row[4]) || 8000         
                    })).filter(t => t.code && t.code.toLowerCase() !== 'id_tache');
                    localStorage.setItem('ref_taches', JSON.stringify(appState.taches));
                }

                if (data.ouvriers && data.ouvriers.length > 0) {
                    appState.ouvriers = data.ouvriers.map(row => ({
                        id: String(row[0] || '').trim(),         
                        nom: String(row[1] || '').trim(),        
                        chef: String(row[2] || '').trim(),       
                        statut: String(row[3] || '').trim()      
                    })).filter(o => o.nom && o.id.toLowerCase() !== 'id_ouvrier' && o.statut.toLowerCase() !== 'inactif');
                    localStorage.setItem('ref_ouvriers', JSON.stringify(appState.ouvriers));
                }
                updateSyncBadge("🟢 Connecté", "var(--success)");
                initialiserUI();
            }
        } catch (e) {
            updateSyncBadge("🟡 Mode Local", "var(--warning)");
        }
    }

    function initialiserUI() {
        const selectChef = document.getElementById('select-global-chef');
        selectChef.innerHTML = '';
        const chefs = [...new Set(appState.ouvriers.map(o => o.chef).filter(Boolean))];
        if (chefs.length === 0) chefs.push("Aucun Chef");
        chefs.forEach(chef => { selectChef.innerHTML += `<option value="${chef}">${chef}</option>`; });
        appState.activeChef = selectChef.options.length > 0 ? selectChef.options[0].value : "";
        onChefChange();
        rafraichirIndicateurSync();
    }

    function onChefChange() {
        appState.activeChef = document.getElementById('select-global-chef').value;
        const selectOuvrier = document.getElementById('select-ouvrier');
        selectOuvrier.innerHTML = '';
        appState.ouvriers.filter(o => o.chef === appState.activeChef).forEach(o => {
            selectOuvrier.innerHTML += `<option value="${o.nom}">${o.nom}</option>`;
        });
        onOuvrierOrDateChange();
    }

    function onOuvrierOrDateChange() {
        const ouvrier = document.getElementById('select-ouvrier').value;
        const date = document.getElementById('input-saisie-date').value;
        const banner = document.getElementById('worker-status-banner');
        if (!ouvrier || !date) { banner.innerText = "Sélectionnez un ouvrier."; return; }

        const stats = toutTachesDuJourOuvrier(ouvrier, date);
        const reste = Math.max(0, MAX_TACHES_JOUR - stats.taches);

        banner.innerHTML = `<strong>${ouvrier}</strong><br>` +
                           `Validé : <strong>${stats.taches.toFixed(2)} / ${MAX_TACHES_JOUR} Unités</strong> (${stats.ar.toLocaleString()} Ar)<br>` +
                           `<span style="color:var(--primary-dark);">Reste dispo : <strong>${reste.toFixed(2)} Unités</strong></span>`;
        recalculerLignes();
    }

    function toutTachesDuJourOuvrier(ouvrier, date) {
        let t = 0, ar = 0;
        appState.saisies.forEach(s => {
            if (s.nomOuvrier === ouvrier && s.dateTravail === date) { t += (s.taches || 0); ar += (s.montantAr || 0); }
        });
        return { taches: t, ar: ar };
    }

    function suggestCode(inp) {
        inp.setAttribute('data-valid', 'false');
        const val = (inp.value || '').toLowerCase().trim();
        const suggestionsDiv = inp.parentElement.querySelector('.autocomplete-suggestions');
        if (!suggestionsDiv) return;
        suggestionsDiv.innerHTML = '';
        if (!appState.taches.length) return;

        appState.taches.filter(t => String(t.code + " " + t.desc).toLowerCase().includes(val)).slice(0, 10).forEach(m => {
            const div = document.createElement('div');
            div.className = 'autocomplete-suggestion';
            div.innerHTML = `<strong>${m.code}</strong> - ${m.desc}<br><span style="color:var(--text-muted); font-size:0.95rem;">Quota: ${m.quota} ${m.unite}</span>`;
            div.onclick = (e) => {
                e.stopPropagation();
                inp.value = `${m.code} - ${m.desc}`;
                inp.setAttribute('data-code', m.code);
                inp.setAttribute('data-quota', m.quota);
                inp.setAttribute('data-prix', m.prix);
                inp.setAttribute('data-valid', 'true');
                suggestionsDiv.innerHTML = '';
                
                if(inp.id === 'search-code') {
                    const res = document.getElementById('consultation-result');
                    res.style.display = 'block';
                    res.innerHTML = `Quota (1 unité) : <strong>${m.quota} ${m.unite}</strong><br>Prix : <strong>${m.prix} Ar</strong>`;
                } else { recalculerLignes(); }
            };
            suggestionsDiv.appendChild(div);
        });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.classList.contains('act-code') && !e.target.closest('.autocomplete-suggestions')) {
            document.querySelectorAll('.autocomplete-suggestions').forEach(div => div.innerHTML = '');
        }
    });

    function recalculerLignes() {
        const ouvrier = document.getElementById('select-ouvrier').value;
        const date = document.getElementById('input-saisie-date').value;
        if (!ouvrier || !date) return;
        const stats = toutTachesDuJourOuvrier(ouvrier, date);

        document.querySelectorAll('.activity-row').forEach((row, idx) => {
            const quota = parseFloat(row.querySelector('.act-code').getAttribute('data-quota'));
            const hint = row.querySelector('.suggestion-hint');
            if (isNaN(quota) || quota <= 0) { hint.innerText = ''; return; }

            let autresFractions = 0;
            document.querySelectorAll('.activity-row').forEach((rOther, rIdx) => {
                if (rIdx !== idx) {
                    const qO = parseFloat(rOther.querySelector('.act-code').getAttribute('data-quota'));
                    const rO = parseFloat(rOther.querySelector('.act-real').value);
                    if (!isNaN(qO) && qO > 0 && !isNaN(rO)) autresFractions += (rO / qO);
                }
            });
            const maxQt = Math.round(Math.max(0, MAX_TACHES_JOUR - stats.taches - autresFractions) * quota * 100) / 100;
            hint.innerHTML = `Max conseillé : ${maxQt}`;
        });
    }

    function enregistrerSaisie() {
        const ouvrier = document.getElementById('select-ouvrier').value;
        const date = document.getElementById('input-saisie-date').value;
        if (!ouvrier || !date) return alert("Sélectionnez un ouvrier et une date.");

        let totalFractions = 0, elements = [], erreur = false;
        document.querySelectorAll('.activity-row').forEach(row => {
            const inp = row.querySelector('.act-code');
            const codeTxt = inp.value;
            const quota = parseFloat(inp.getAttribute('data-quota'));
            const prix = parseFloat(inp.getAttribute('data-prix')) || 8000;
            const real = parseFloat(row.querySelector('.act-real').value);

            if (codeTxt && inp.getAttribute('data-valid') !== 'true') {
                alert(`Erreur : Veuillez sélectionner "${codeTxt}" dans la liste déroulante.`);
                erreur = true;
            }
            if (!erreur && codeTxt && !isNaN(quota) && quota > 0 && !isNaN(real) && real > 0) {
                totalFractions += (real / quota);
                elements.push({ tache: codeTxt, quantite: real, quota: quota, prix: prix });
            }
        });

        if (erreur) return;
        if (!elements.length) return alert("Renseignez au moins une tâche valide.");

        const stats = toutTachesDuJourOuvrier(ouvrier, date);
        const dispo = MAX_TACHES_JOUR - stats.taches;
        if (dispo <= 0) return alert("Quota journalier déjà atteint pour cet ouvrier.");

        const ratio = totalFractions > dispo ? (dispo / totalFractions) : 1;
        elements.forEach(el => {
            const qte = el.quantite * ratio;
            const t = qte / el.quota;
            appState.saisies.push({
                dateTravail: date, chefEquipe: appState.activeChef, nomOuvrier: ouvrier,
                tache: el.tache, quantite: qte, taches: t, montantAr: Math.round(t * el.prix), synced: false
            });
        });

        localStorage.setItem('saisies_hors_ligne', JSON.stringify(appState.saisies));
        if (ratio < 1) alert("Volumes ajustés pour respecter le plafond de 2 unités.");
        
        document.querySelectorAll('.activity-row').forEach(r => {
            r.querySelector('.act-code').value = ''; r.querySelector('.act-real').value = '';
            r.querySelector('.act-code').setAttribute('data-valid', 'false');
            r.querySelector('.suggestion-hint').innerText = '';
        });
        onOuvrierOrDateChange(); rafraichirIndicateurSync();
    }

    function editerSaisieOuvrier(date, ouvrier) {
        if(!confirm(`Modifier les activités de ${ouvrier} ?`)) return;
        switchTab('tab2', document.getElementById('btn-tab-saisie'));
        document.getElementById('input-saisie-date').value = date;
        document.getElementById('select-ouvrier').value = ouvrier;
        
        const anc = appState.saisies.filter(s => s.dateTravail === date && s.nomOuvrier === ouvrier);
        const rows = document.querySelectorAll('.activity-row');
        rows.forEach(r => { r.querySelector('.act-code').value = ''; r.querySelector('.act-real').value = ''; });
        
        anc.forEach((item, i) => {
            if(rows[i]) {
                const inp = rows[i].querySelector('.act-code');
                const tRef = appState.taches.find(t => `${t.code} - ${t.desc}` === item.tache);
                inp.value = item.tache; inp.setAttribute('data-valid', 'true');
                if(tRef) { inp.setAttribute('data-quota', tRef.quota); inp.setAttribute('data-prix', tRef.prix); }
                rows[i].querySelector('.act-real').value = item.quantite;
            }
        });
        appState.saisies = appState.saisies.filter(s => !(s.dateTravail === date && s.nomOuvrier === ouvrier));
        localStorage.setItem('saisies_hors_ligne', JSON.stringify(appState.saisies));
        onOuvrierOrDateChange(); rafraichirIndicateurSync();
    }

    function rafraichirRapports() {
        const d = document.getElementById('report-date').value;
        const tbodyG = document.querySelector('#table-global-taches tbody');
        const tbodyD = document.querySelector('#table-detail-ouvriers tbody');
        tbodyG.innerHTML = ''; tbodyD.innerHTML = '';

        const dataJour = appState.saisies.filter(s => s.dateTravail === d);
        if (!dataJour.length) return;

        let recap = {}, details = {};
        dataJour.forEach(s => {
            if (!recap[s.tache]) recap[s.tache] = { q:0, t:0 };
            recap[s.tache].q += s.quantite; recap[s.tache].t += s.taches;
            if (!details[s.nomOuvrier]) details[s.nomOuvrier] = { acts: [], totTaches:0, totAr:0 };
            details[s.nomOuvrier].acts.push(`${s.tache} : ${s.quantite.toFixed(2)}`);
            details[s.nomOuvrier].totTaches += s.taches; details[s.nomOuvrier].totAr += s.montantAr;
        });

        for (const [t, v] of Object.entries(recap)) {
            tbodyG.innerHTML += `<tr><td>${t}</td><td>${v.q.toFixed(2)}</td><td>${v.t.toFixed(2)}</td></tr>`;
        }
        for (const [o, v] of Object.entries(details)) {
            tbodyD.innerHTML += `<tr><td><strong>${o}</strong></td><td style="white-space:pre-wrap;">${v.acts.join('<br>')}</td><td>${v.totTaches.toFixed(2)}</td><td>${v.totAr.toLocaleString()}</td><td>${dataJour.find(x => x.nomOuvrier === o && x.synced) ? '✅' : `<button onclick="editerSaisieOuvrier('${d}', '${o}')" style="padding:8px 12px; font-size:0.9rem; background:#e2e8f0; color:var(--text-main);">Modifier</button>`}</td></tr>`;
        }
    }

    async function synchroniserDonnees() {
        if (!navigator.onLine) return alert("Pas de connexion internet.");
        const aSync = appState.saisies.filter(s => !s.synced);
        if (!aSync.length) return alert("Tout est déjà synchronisé !");
        updateSyncBadge("🔄 Envoi...", "var(--warning)");

        try {
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(aSync) });
            appState.saisies.forEach(s => s.synced = true);
            localStorage.setItem('saisies_hors_ligne', JSON.stringify(appState.saisies));
            updateSyncBadge("🟢 Connecté", "var(--success)");
            rafraichirIndicateurSync(); rafraichirRapports();
            alert("✅ Données synchronisées avec succès !");
        } catch (e) {
            updateSyncBadge("🔴 Erreur", "var(--danger)");
            alert("Erreur réseau.");
        }
    }

    function rafraichirIndicateurSync() {
        const nb = appState.saisies.filter(s => !s.synced).length;
        document.getElementById('sync-summary-banner').innerHTML = `Lignes en attente réseau : <strong>${nb}</strong>`;
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        document.getElementById('global-context-card').style.display = (tabId === 'tab4') ? 'none' : 'block';
        if (tabId === 'tab3') rafraichirRapports();
        window.scrollTo(0, 0);
    }

    function updateSyncBadge(txt, color) {
        const b = document.getElementById('sync-status');
        b.innerText = txt; b.style.color = color;
    }

    function capturerRapport() {
        const d = document.getElementById('report-date').value;
        const cont = document.getElementById('capture-container');
        cont.innerHTML = `<div style="font-family:sans-serif; font-size:1.1rem;">
            <h1 style="color:#1e40af;text-align:center;">CANOPY ENERGY</h1>
            <h3 style="text-align:center;">Bilan: ${d} | Chef: ${appState.activeChef}</h3>
            ${document.getElementById('tab3').innerHTML.replace(/<button.*?>.*?<\/button>/g, '')}
        </div>`;
        html2canvas(cont).then(canvas => {
            const link = document.createElement('a');
            link.download = `Canopy_Rapport_${d}.png`;
            link.href = canvas.toDataURL("image/png"); link.click();
            cont.innerHTML = '';
        });
    }

    window.addEventListener('online', () => chargerReferentiels());
    window.addEventListener('offline', () => updateSyncBadge("☁️ Hors-ligne", "var(--warning)"));
</script>
</body>
</html>
